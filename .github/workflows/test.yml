name: "Test"

on:
  pull_request:
    paths-ignore:
    - '**/*.md'
    - 'CODEOWNERS'
    - 'LICENSE'
  merge_group:

concurrency:
  group: ci-tests-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  test_and_check_coverage:
    runs-on: [self-hosted, linux]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: "Setup Dotnet for use with actions"
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: "Detect dotnet on self-hosted Linux"
      if: ${{ runner.environment == 'self-hosted' && runner.os == 'Linux' }}
      shell: bash
      run: |
        DOTNET_PATH="$(command -v dotnet || true)"
        if [ -z "$DOTNET_PATH" ]; then
          echo "dotnet was not found on PATH" >&2
          exit 1
        fi

        DOTNET_ROOT="$(dirname "$(dirname "$(readlink -f "$DOTNET_PATH")")")"
        echo "Using dotnet from $DOTNET_PATH"
        echo "DOTNET_ROOT=$DOTNET_ROOT" >> "$GITHUB_ENV"
        echo "$DOTNET_ROOT" >> "$GITHUB_PATH"
    - name: "Cache NuGet packages"
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/global.json', '**/NuGet.Config', '**/nuget.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: "Test"
      working-directory: ImperatorToCK3.UnitTests
      shell: pwsh
      run: |
       dotnet test --coverlet --coverlet-output-format lcov --coverlet-file-prefix irtock3
    - name: "Locate coverage report"
      id: coverage_report
      shell: pwsh
      run: |
        $coverageFile = Get-ChildItem "ImperatorToCK3.UnitTests/bin/Debug/net10.0/TestResults/irtock3.coverage*.info" |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1 -ExpandProperty FullName

        if (-not $coverageFile) {
          throw "Coverage report not found."
        }

        "path=$coverageFile" >> $env:GITHUB_OUTPUT
    - name: "Publish coverage report to coveralls.io"
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ${{ steps.coverage_report.outputs.path }}
        format: lcov
        debug: true

  test:
    strategy:
      matrix:
        os: [[self-hosted, windows], macos-14]
    runs-on: ${{ matrix.os }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: "Setup Dotnet for use with actions"
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: "Detect dotnet on self-hosted Linux"
      if: ${{ runner.environment == 'self-hosted' && runner.os == 'Linux' }}
      shell: bash
      run: |
        DOTNET_PATH="$(command -v dotnet || true)"
        if [ -z "$DOTNET_PATH" ]; then
          echo "dotnet was not found on PATH" >&2
          exit 1
        fi

        DOTNET_ROOT="$(dirname "$(dirname "$(readlink -f "$DOTNET_PATH")")")"
        echo "Using dotnet from $DOTNET_PATH"
        echo "DOTNET_ROOT=$DOTNET_ROOT" >> "$GITHUB_ENV"
        echo "$DOTNET_ROOT" >> "$GITHUB_PATH"
    - name: "Cache NuGet packages"
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/global.json', '**/NuGet.Config', '**/nuget.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: "Test"
      working-directory: ImperatorToCK3.UnitTests
      run: |
       dotnet test
